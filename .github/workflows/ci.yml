name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NANODUCK_MYSQL_TEST_URL: mysql://root:synthetic-test-password@127.0.0.1:3306
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag nanoduck-northflank:check .
      - name: Verify container runtime
        run: >-
          docker run --rm --entrypoint sh nanoduck-northflank:check -c
          'test "$(id -u)" != 0 && test -w /tmp && test -r /app/instructions/RUNTIME_PROMPTS.md
          && codex --version && claude --version'
