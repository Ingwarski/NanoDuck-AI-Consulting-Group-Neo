name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner and scan all history
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          trap 'rm -rf "$tool_dir"' EXIT
          archive="${tool_dir}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          scan_status=0
          "${tool_dir}/gitleaks" git . \
            --log-opts='--all' --redact=100 --no-banner --exit-code=2 \
            --report-format=json --report-path="${tool_dir}/report.json" \
            >"${tool_dir}/scan.log" 2>&1 || scan_status=$?
          python3 .github/scripts/summarize-gitleaks.py \
            "${tool_dir}/report.json" "$scan_status"

  zizmor:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows and publish code-scanning results
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: v1.30.1
          advanced-security: true
